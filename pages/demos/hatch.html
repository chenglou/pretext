<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rivers · Pretext demo (prototype)</title>
  <meta name="description" content="One plain paragraph whose every word space lies on a line of a drawing: sun rays, an island and the sea, hatched in rivers.">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { background: #f4f0e6; color: #1f1d1a; min-height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; padding: 28px 20px 48px; }
    h1 { font: 400 22px/1.3 Georgia, serif; margin-bottom: 4px; }
    .subtitle { font: italic 400 13px/1.5 Georgia, serif; color: rgba(31,29,26,0.55); margin-bottom: 22px; max-width: 640px; text-align: center; }
    #scene { position: relative; }
    #text { text-align: left; }
    #seams { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    #seams path { fill: none; stroke: #c9651c; stroke-opacity: 0.55; stroke-linecap: round; stroke-linejoin: round; }
    .bar { display: flex; gap: 14px; align-items: center; margin-top: 18px; font: 400 12px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; color: rgba(31,29,26,0.6); flex-wrap: wrap; justify-content: center; max-width: 900px; }
    .bar button {
      font: inherit; color: #1f1d1a; background: transparent; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(31,29,26,0.25);
    }
  </style>
</head>
<body>
  <h1>Rivers</h1>
  <p class="subtitle">One plain paragraph, wrapped by the browser. No space is stretched: every word was chosen so its gap falls on a line of the drawing.</p>
  <div id="scene">
    <p id="text"></p>
    <svg id="seams"><path id="seam-path"></path></svg>
  </div>
  <div class="bar">
    <button data-action="seams" id="seams-button"></button>
    <span id="stats"></span>
  </div>
  <script type="module" src="./hatch.ts"></script>
</body>
</html>
