<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rich text rendered as text runs, links, code spans, and atomic chips, with live width changes powered by Pretext.">
  <title>Rich Text</title>
  <style>
    /* A classic scrollbar keeps its room from the first frame, without an empty
       track on short pages, so the width the page reads doesn't change when the
       note grows past the window. */
    html { scrollbar-gutter: stable; }
    * { box-sizing: border-box; margin: 0; }
    :root {
      color-scheme: light;
      --page: #f5f1ea;
      --panel: #fffdf8;
      --ink: #201b18;
      --muted: #6d645d;
      --rule: #d8cec3;
      --accent: #955f3b;
      --note-width: 556px;
      --note-content-width: 516px;
    }
    html, body {
      min-height: 100%;
      background: linear-gradient(180deg, #fbf7f0 0%, var(--page) 100%);
      color: var(--ink);
    }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    .page {
      width: min(940px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }
    .intro {
      width: min(720px, 100%);
      margin: 0 auto 20px;
    }
    .eyebrow {
      margin: 0 0 8px;
      font: 12px/1.2 "SF Mono", ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font: 700 34px/1.08 Georgia, "Times New Roman", serif;
    }
    .lede {
      margin: 10px 0 0;
      max-width: 63ch;
      font: 400 15px/1.52 "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--muted);
    }
    .toolbar {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      box-shadow: 0 18px 40px rgb(54 40 23 / 0.08);
    }
    .toolbar-label {
      font: 600 11px/1 "SF Mono", ui-monospace, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .toolbar-value {
      font: 600 13px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--muted);
    }
    .preview {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }
    .note-shell {
      width: var(--note-width);
      border-radius: 20px;
      padding-block: 20px;
      padding-inline: var(--note-padding-x);
      background: color-mix(in srgb, var(--panel) 94%, white 6%);
      /* The ring is a shadow, so it adds no width to the card. */
      box-shadow: inset 0 0 0 1px var(--rule), 0 18px 40px rgb(54 40 23 / 0.08);
    }
    .note-body {
      position: relative;
      width: var(--note-content-width);
      min-height: 34px;
    }
    .line-row {
      position: absolute;
      left: 0;
      right: 0;
      /* Spaces collapse as in the text Pretext laid out, so a line that wraps
         inside an item doesn't paint the space it ends on. */
      white-space: nowrap;
      font: var(--font);
      /* As on each fragment, so a line with a chip is 24px, the chip's
         height, which the body counts for the last line. */
      line-height: 1;
    }
    .frag {
      font: var(--font);
      line-height: 1;
      color: var(--ink);
    }
    .frag--link {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.14em;
    }
    .frag--code {
      padding: 2px 7px 3px;
      border-radius: 3px;
      background: rgba(17, 31, 43, 0.08);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      min-height: 24px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid transparent;
      vertical-align: baseline;
      transform: translateY(-1px);
    }
    .chip--mention { background: rgba(21, 90, 136, 0.12); color: #155a88; border-color: rgba(21, 90, 136, 0.12); }
    .chip--status { background: rgba(196, 129, 20, 0.12); color: #916207; border-color: rgba(196, 129, 20, 0.14); }
    .chip--priority { background: rgba(176, 44, 44, 0.1); color: #8e2323; border-color: rgba(176, 44, 44, 0.14); }
    .chip--time { background: rgba(70, 118, 77, 0.11); color: #355f38; border-color: rgba(70, 118, 77, 0.14); }
    .chip--count { background: rgba(67, 57, 122, 0.1); color: #483e83; border-color: rgba(67, 57, 122, 0.13); }
    @media (max-width: 900px) {
      .preview {
        justify-content: center;
      }
    }
    /* rich-note.model.ts picks the card's narrow padding with the same query. */
    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 940px);
        padding-top: 22px;
      }
      h1 { font-size: 30px; }
      .toolbar {
        grid-template-columns: 1fr;
        justify-items: stretch;
        border-radius: 22px;
      }
      .toolbar-label,
      .toolbar-value {
        text-align: left;
      }
      .note-shell {
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro">
      <p class="eyebrow">Demo</p>
      <h1>Rich Text</h1>
      <p class="lede">
        Rich text rendered as text runs, links, code spans, and atomic chips.
        Adjust the text width to watch the chips stay whole while the surrounding text and code keep wrapping naturally when space gets tight.
      </p>
    </section>

    <div class="toolbar">
      <div class="toolbar-label">Text Width</div>
      <input id="width-slider" type="range" min="260" max="760" value="516">
      <span class="toolbar-value" id="width-value">516px</span>
    </div>

    <section class="preview">
      <article class="note-shell" id="note-shell">
        <div class="note-body" id="note-body"></div>
      </article>
    </section>
  </main>
  <script type="module" src="./rich-note.ts"></script>
</body>
</html>
